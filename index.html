function box(f,m){return[f.x+f.f*m[6],f.y-m[7],m[4],m[5]]}
function ov(a,b){return Math.abs(a[0]-b[0])<(a[2]+b[2])/2&&Math.abs(a[1]-b[1])<(a[3]+b[3])/2}
function hurt(o){return[o.x,o.y-25,30,50]}
function pop(f,n){f.pop=n;f.pt=70}
function hit(f,o,m,a){if(a.h.has(o)||!f.hb||!ov(f.hb,hurt(o)))return;a.h.add(o);apply(f,o,m,a,Math.sign(o.x-f.x)||f.f)}
function apply(f,o,m,a,dir){const d=m[0];if(o.inv>0)return;
if(o.ctr>0){o.ctr=0;o.atk=null;o.inv=25;apply(o,f,[d*1.4+6,6,.9,40],{h:new Set},-dir);return}
if(o.sh&&!(a&&a.grab)){o.shh-=d*1.5+4;o.vx+=dir*2;f.vx-=dir;if(o.shh<=0){o.stun=90;o.sh=0;o.shh=40}return}
if(a&&a.k=='ref'&&a.s[3])o.f=-o.f;
o.dmg+=d;f.mt=Math.min(100,f.mt+d*1.2);o.mt=Math.min(100,o.mt+d*.8);
let sp=Math.min((m[1]+m[2]*o.dmg/12)*100/o.C.w,32);const r=m[3]*Math.PI/180;
o.vx=Math.cos(r)*dir*sp;o.vy=-Math.sin(r)*sp;o.stun=Math.floor(sp*1.8)+8;o.atk=null;if(o.vy<0)o.air=1}
function atk(f,k){f.atk={k:'mv',m:f.mv[k],t:0,h:new Set,grab:k=='grab',dash:k=='dash'};pop(f,NM[k])}
function spc(f,S){if(S[1]=='chg'){f.mt=Math.min(100,f.mt+30);S=['リミットチャージ','ctr',0]}if(f.air&&f.upu&&(S[1]=='up'||(S[1]=='dash'&&S[6]&&S[6].up)))return;
if(S[1]=='mel'){f.atk={k:'mv',m:S[2],t:0,h:new Set};pop(f,S[0]);return}
f.atk={k:S[1],s:S,t:0,h:new Set,chg:0};pop(f,S[0]);if(S[1]=='up')f.upu=1;if(S[1]=='ref')f.ref=S[2];if(S[1]=='ctr')f.ctr=S[2];if(S[1]=='beam')f.mt=0}
function fire(f,o,a){const S=a.s,op=S[8]||{},sc=1+a.chg/45;
const p={x:f.x+f.f*24,y:f.y-30,vx:f.f*S[3]*(.8+.2*sc),vy:0,o:f,d:S[2]*sc,life:S[4],g:S[5],r:S[6]*(.8+.5*a.chg/45),col:S[7],ret:op.ret,ex:op.ex,push:op.push,bn:op.bn,kb:op.push||3.5,h:new Set};
if(op.fall){p.x=f.x;p.y=f.y-250;p.vy=14;p.vx=0}PJ.push(p)}
function doAtk(f,o,I){const a=f.atk,k=a.k;a.t++;const t=a.t;
if(k=='mv'){const m=a.m,s=m[8],ac=m[9];if(!f.air)f.vx*=.8;if(a.dash&&t>=s&&t<s+ac)f.vx=f.f*5.5;
 if(t>=s&&t<s+ac){f.hb=box(f,m);hit(f,o,m,a)}if(t>=s+ac+m[10])f.atk=null;return}
const S=a.s;if(!f.air&&k!='dash'&&k!='up')f.vx*=.8;
if(k=='proj'){const op=S[8]||{},st=op.rp?3:7;if(t==st&&op.ch&&I.bh&&a.chg<45){a.t--;a.chg++;return}
 if(t==st)fire(f,o,a);if(t>=st+(op.rp?7:14))f.atk=null;return}
if(k=='dash'){const op=S[6]||{},st=6,fr=S[3];
 if(t<st){f.ng=1;f.vx*=.5;f.vy*=.5;if(t==st-1){let dx=f.f,dy=0;
  if(op.aim){dx=I.x;dy=I.y;if(Math.hypot(dx,dy)<.3){dx=op.up?0:f.f;dy=op.up?-1:0}const l=Math.hypot(dx,dy);dx/=l;dy/=l;if(dx)f.f=dx>0?1:-1}else if(op.dn&&f.air)dy=.7;
  a.vx=dx*S[2];a.vy=dy*S[2]}}
 else if(t<st+fr){f.ng=1;f.vx=a.vx;f.vy=a.vy;const m=[S[4],S[5],.7,40,60,60,0,28,0,0,0];f.hb=box(f,m);hit(f,o,m,a)}
 else if(t<st+fr+14){if(t==st+fr){f.vx*=.3;f.vy*=.3}}else f.atk=null;return}
if(k=='up'){const st=4;if(t<st){f.ng=1;f.vx*=.5;f.vy=0}
 else if(t<st+S[3]){f.ng=1;f.vy=-S[2]*(1-(t-st)/S[3]*.5);f.vx=I.x*S[5]*2;const m=[S[4],4,.7,80,60,70,0,40,0,0,0];if(t<st+12){f.hb=box(f,m);hit(f,o,m,a)}}
 else if(t>=st+S[3]+18)f.atk=null;return}
if(k=='ref'){if(t>=2&&t<8){const tn=S[3],m=[tn?3:2,tn?2:3,.1,40,tn?60:70,60,tn?30:0,30,0,0,0];f.hb=box(f,m);hit(f,o,m,a)}if(t>=S[2]+6)f.atk=null;return}
if(k=='ctr'){if(t>=S[2]+8)f.atk=null;return}
if(k=='beam'){f.ng=1;f.vx=f.vy=0;f.inv=3;const st=20;
 if(t>=st&&t<st+S[3]){if((t-st)%10==0)a.h.clear();const m=[S[2]/(S[3]/10),(t>=st+S[3]-10)?14:2,.6,35];f.hb=[f.x+f.f*S[4]/2,f.y-30,S[4],S[5]];hit(f,o,m,a)}
 else if(t>=st+S[3]+10)f.atk=null}}
function upd(f,o,I){const C=f.C;f.ng=0;f.hb=null;if(f.inv>0)f.inv--;if(f.ref>0)f.ref--;if(f.ctr>0)f.ctr--;if(f.pt>0)f.pt--;if(f.pass>0)f.pass--;
const cx=I.x,cy=I.y,p=I.p;f.fast=0;
if(f.stun>0){f.stun--;f.vx*=f.air?.97:.85;f.sh=0}
else if(f.atk){doAtk(f,o,I)}
else{
 f.sh=I.sh&&!f.air&&f.shh>5?1:0;if(f.sh){f.shh-=.35;f.vx*=.7}else f.shh=Math.min(100,f.shh+.25);
 if(!f.sh){
  if(Math.abs(cx)>.25)f.f=cx>0?1:-1;
  f.vx+=(cx*C.s-f.vx)*(f.air?.06:.25);
  if(p.j){if(!f.air){f.vy=-C.jh;f.air=1}else if(f.j>0){f.j--;f.vy=-C.jh*.95}}
  if(f.air&&cy>.7&&f.vy>0)f.fast=1;
  if(!f.air&&cy>.9&&f.y<375&&!p.a&&!p.sm){f.pass=12;f.air=1;f.y+=3}
  const key=cy<-.5?'u':cy>.5?'d':Math.abs(cx)>.4?'s':'n';
  if(p.f&&f.mt>=100)spc(f,C.sp.f);
  else if(p.b)spc(f,C.sp[key]);
  else if(p.g&&!f.air)atk(f,'grab');
  else if(p.a||p.sm){
   if(f.air){atk(f,key=='u'?'uair':key=='d'?'dair':key=='s'?((cx>0?1:-1)==f.f?'fair':'bair'):'nair')}
   else if(p.sm)atk(f,key=='u'?'usmash':key=='d'?'dsmash':'fsmash');
   else atk(f,key=='u'?'utilt':key=='d'?'dtilt':key=='s'?(Math.abs(f.vx)>C.s*.75?'dash':'ftilt'):'jab')}
 }}
phys(f)}
function phys(f){if(!f.ng)f.vy=Math.min(f.vy+G*(f.fast?1.5:1),f.stun>0?20:f.fast?15:11);
const py=f.y;f.x+=f.vx;f.y+=f.vy;let land=0;
if(f.vy>=0)for(const q of FL)if(f.x>q[0]&&f.x<q[1]&&py<=q[2]+1&&f.y>=q[2]&&!(q[3]&&f.pass>0)){f.y=q[2];f.vy=0;land=1}
if(land){f.air=0;f.j=f.C.xj||1;f.upu=0}else f.air=1;
if(f.x<-120||f.x>W+120||f.y>H+140||f.y<-260){f.st--;if(f.st<=0){end(f.h?'まけ…':'かち！')}else spawn(f)}}
function ai(f,o){const I={x:0,y:0,p:{},bh:0,sh:0},dx=o.x-f.x,ad=Math.abs(dx),sg=Math.sign(dx)||1,r=Math.random;
if(f.x<190||f.x>770||f.y>400){I.x=f.x<480?1:-1;if(f.air&&f.y>360&&f.vy>0){if(f.j>0&&r()<.2)I.p.j=1;else if(r()<.12){I.y=-1;I.p.b=1}}return I}
I.x=ad>60?sg*.8:0;
if(ad<70){if(r()<.06){const t=r();I.y=t<.3?-1:t<.5?1:0;if(t>=.5)I.x=sg*.5;I.p[r()<.3?'sm':'a']=1}}
else if(ad<320&&r()<.015){I.p.b=1;I.x=sg}
if(!f.air&&(r()<.008||(o.y<f.y-60&&r()<.03)))I.p.j=1;
if(f.mt>=100&&r()<.02)I.p.f=1;
if(o.atk&&ad<100&&r()<.4)I.sh=1;return I}
function updPJ(){for(const p of PJ){p.life--;p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;
if(p.ret&&p.life==25){p.vx=-p.vx;p.h.clear()}
if(p.y+p.r>=380&&p.x>180&&p.x<780&&p.vy>0){if(p.bn)p.vy=-5;else if(p.ex&&!p.blast){blast(p)}else if(p.g>0&&!p.ex)p.life=0;else if(p.fall)p.life=0}
for(const f of P){if(f==p.o||p.h.has(f)||p.life<=0)continue;if(!ov([p.x,p.y,p.r*2,p.r*2],hurt(f)))continue;
 if(f.ref>0&&f.f*(p.x-f.x)>0){p.o=f;p.vx=-p.vx*1.2;p.h.clear();continue}
 p.h.add(f);apply(p.o,f,[p.d,p.kb,.5,p.push?30:40],null,Math.sign(p.vx)||Math.sign(f.x-p.x)||1);
 if(p.ex&&!p.blast)blast(p);else if(!p.ret&&!p.blast)p.life=0}
if(p.x<-100||p.x>W+100||p.y>H+150||p.y<-300)p.life=0}PJ=PJ.filter(p=>p.life>0)}
function blast(p){p.blast=1;p.r=48;p.vx=p.vy=p.g=0;p.life=6;p.d*=1.2;p.kb=5;p.h.clear()}
let res='';function end(t){on=0;res=t;const m=document.getElementById('menu');m.style.display='flex';document.getElementById('msg').textContent='結果: '+t}
// ---------- 描画 ----------
function draw(){c.setTransform(1,0,0,1,0,0);c.fillStyle='#223';c.fillRect(0,0,cv.width,cv.height);c.setTransform(cvs,0,0,cvs,ox0,oy0);
c.fillStyle='#46a';c.fillRect(0,0,W,H);c.fillStyle='#8c5';for(const q of FL){c.fillRect(q[0],q[2],q[1]-q[0],q[3]?8:40)}
c.fillStyle='#753';c.fillRect(180,388,600,60);
for(const p of PJ){c.fillStyle=p.col;c.globalAlpha=p.blast?.6:1;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill();c.globalAlpha=1}
for(const f of P){c.save();if(f.inv>0&&f.inv%6<3)c.globalAlpha=.4;
 c.fillStyle=f.stun>0?'#fff':f.C.c;c.fillRect(f.x-15,f.y-50,30,50);c.beginPath();c.arc(f.x,f.y-58,12,0,7);c.fill();
 c.fillStyle='#000';c.fillRect(f.x+f.f*6-2,f.y-61,4,4);
 if(f.sh){c.fillStyle='#4cf6';c.beginPath();c.arc(f.x,f.y-28,18+f.shh*.2,0,7);c.fill()}
 if(f.ref>0||f.ctr>0){c.strokeStyle='#fff';c.lineWidth=3;c.beginPath();c.arc(f.x,f.y-28,36,0,7);c.stroke()}
 if(f.hb){c.fillStyle='#fff6';c.fillRect(f.hb[0]-f.hb[2]/2,f.hb[1]-f.hb[3]/2,f.hb[2],f.hb[3])}
 c.restore();
 if(f.pt>0){c.fillStyle='#fff';c.font='bold 14px sans-serif';c.textAlign='center';c.fillText(f.pop,f.x,f.y-80)}}
P.forEach((f,i)=>{const x=i?W-190:30;c.textAlign='left';c.fillStyle='#fff';c.font='bold 14px sans-serif';c.fillText((f.h?'あなた ':'CPU ')+f.C.n,x,24);
 c.font='bold 36px sans-serif';c.fillStyle=f.dmg<80?'#fff':f.dmg<150?'#fa0':'#f33';c.fillText(Math.floor(f.dmg)+'%',x,62);
 c.fillStyle='#fc0';for(let s=0;s<f.st;s++){c.beginPath();c.arc(x+8+s*18,76,6,0,7);c.fill()}
 c.fillStyle='#333';c.fillRect(x,86,120,8);c.fillStyle=f.mt>=100?'#f5f':'#5cf';c.fillRect(x,86,120*f.mt/100,8)})}
let acc=0,last=0;
function loop(ts){acc+=Math.min(50,ts-last);last=ts;
while(acc>=16.7){acc-=16.7;if(on){const I={x:IN.x,y:IN.y,bh:IN.bh,sh:IN.sh,p:IN.p};upd(P[0],P[1],I);IN.p={};if(on)upd(P[1],P[0],ai(P[1],P[0]));updPJ()}}
if(P.length)draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
